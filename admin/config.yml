                name: "hotro"
                widget: "object"
                collapsed: true
                fields:
                  - label: "1 năm"
                    name: "nam1"
                    widget: "object"
                    collapsed: true
                    fields:
                      - {label: "Giảm giá tối đa (đ) — thay thế \"Số tháng tặng\", không cộng dồn", name: "giam", widget: "number", value_type: "int"}
                      - {label: "Số tháng tặng tối đa (thay thế giảm giá)", name: "thangTang", widget: "number", value_type: "int"}
                      - {label: "Hóa đơn điện tử tặng thêm/năm (đợt KM)", name: "hddtNam", widget: "number", value_type: "int"}
                      - {label: "Mô tả quà tặng (hiển thị cho khách)", name: "qua", widget: "string", required: false}
                      - label: "Quà tặng cố định 1 (để trống = không cố định)"
                        name: "qua1"
                        widget: "select"
                        required: false
                        default: "none"
                        options:
                          - {label: "Không cố định", value: "none"}
                          - {label: "01 Máy in hoá đơn KV804", value: "kv804"}
                          - {label: "01 Màn hình hiển thị QR - KV99", value: "kv99"}
                          - {label: "01 Máy in hóa đơn để bàn KV505", value: "kv505"}
                          - {label: "Giấy in nhiệt (hóa đơn) K80*45 - 50 cuộn", value: "giay"}
                          - {label: "Máy in mã vạch 365B (phụ thu 200.000đ)", value: "365b"}
                          - {label: "01 Máy quét mã vạch XL-6500A", value: "xl6500a"}
                      - label: "Quà tặng cố định 2 (chỉ dùng khi tặng nhiều món)"
