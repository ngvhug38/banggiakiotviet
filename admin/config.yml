          - {label: "Tên đợt khuyến mãi", name: "ten", widget: "string"}
          - {label: "Từ ngày", name: "tuNgay", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false}
          - {label: "Đến ngày", name: "denNgay", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false}
          - label: "Ngành Bán lẻ (Retail)"
            name: "banle"
            widget: "object"
            collapsed: true
            fields:
