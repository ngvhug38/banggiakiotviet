<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CMS · Quản trị bảng giá KiotViet</title>
  <!-- Trang này CHỈ dùng để đăng nhập & soạn thảo nội dung (Decap CMS).
       Trang báo giá cho khách nằm ở /index.html — không đặt chung với trang này. -->

  <!-- Netlify Identity: bắt buộc để backend "git-gateway" xác thực người chỉnh sửa (Netlify Identity user).
       Nếu site không dùng Netlify Identity/Git Gateway mà dùng GitHub backend trực tiếp, có thể bỏ dòng này
       và đổi "backend.name" trong config.yml sang "github" + khai báo repo/branch tương ứng. -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <!-- Decap CMS (bản kế thừa chính thức của Netlify CMS) -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <!-- Preview tuỳ chỉnh cho 3 loại nội dung: pricing / hardware / promotions.
       BẮT BUỘC nạp SAU decap-cms.js (đúng như comment ghi sẵn trong chính file preview.js). -->
  <script src="preview.js"></script>

  <script>
    // Điều hướng luồng mời/đặt lại mật khẩu của Netlify Identity về đúng trang xử lý,
    // rồi mở khung đăng nhập — nếu không có đoạn này, link mời qua email sẽ vào thẳng
    // trang này mà không tự mở form nhập mật khẩu.
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", function (user) {
        if (!user) {
          window.netlifyIdentity.on("login", function () {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
