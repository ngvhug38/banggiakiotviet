<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager</title>
</head>
<body>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <!-- Preview đẹp cho Bảng giá / Danh mục thiết bị / Khuyến mãi theo ngành, thay cho khối JSON thô mặc định.
       Phải đặt SAU dòng decap-cms.js ở trên, vì preview.js cần dùng các biến CMS/createClass/h do decap-cms.js cấp. -->
  <script src="preview.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
